name: Release

# Push a tag that matches pubspec.yaml (version: 1.0.7+8 -> tag v1.0.7) to build
# every platform and publish a GitHub Release whose notes come from that
# version's CHANGELOG.md section. A manual run builds the same artifacts without
# publishing anything.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Public production endpoints baked into every build's .env.
env:
  EREBRUS_WEB_ORIGIN: https://erebrus.io
  GATEWAY_URL: https://gateway.erebrus.io

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version and check the tag
        id: version
        run: |
          VERSION_LINE="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          VERSION_NAME="${VERSION_LINE%%+*}"
          VERSION_CODE="${VERSION_LINE##*+}"
          TAG="v${VERSION_NAME}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "${TAG}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pubspec.yaml version ${VERSION_LINE} (expected ${TAG})."
            exit 1
          fi
          echo "version_name=${VERSION_NAME}" >> "${GITHUB_OUTPUT}"
          echo "version_code=${VERSION_CODE}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

      # Headings look like "## 1.0.6+7 — 2026-08-21"; "## 1.0.6" also matches.
      - name: Extract changelog section
        env:
          VERSION_LINE: ${{ steps.version.outputs.version_name }}+${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          names = "|".join(re.escape(v) for v in (os.environ["VERSION_LINE"], os.environ["VERSION_NAME"]))
          changelog = Path("CHANGELOG.md").read_text()
          section = re.search(rf"^## (?:{names})(?:[ \t][^\n]*)?\n(.*?)(?=^## |\Z)", changelog, re.M | re.S)
          if section is None or not section.group(1).strip():
              message = f"CHANGELOG.md has no section for {os.environ['VERSION_LINE']}"
              if os.environ["GITHUB_REF_TYPE"] == "tag":
                  raise SystemExit(f"::error::{message}")
              print(f"::warning::{message}")
              body = "_No changelog entry._"
          else:
              body = section.group(1).strip()
          Path("changelog-section.md").write_text(body + "\n")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: changelog-section.md

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Free gitleaks CLI (pinned + checksum-verified); see ci.yml.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz
      - name: Scan git history for secrets
        run: ./gitleaks git --config .gitleaks.toml --redact --verbose --exit-code 1 .

  verify:
    needs: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - run: cp .env.example .env

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-android:
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GOTOOLCHAIN: local
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check signing secrets
        env:
          PLAYSTORE_KEYSTORE_BASE64: ${{ secrets.PLAYSTORE_KEYSTORE_BASE64 }}
          PLAYSTORE_STORE_PASSWORD: ${{ secrets.PLAYSTORE_STORE_PASSWORD }}
          PLAYSTORE_KEY_ALIAS: ${{ secrets.PLAYSTORE_KEY_ALIAS }}
          PLAYSTORE_KEY_PASSWORD: ${{ secrets.PLAYSTORE_KEY_PASSWORD }}
          DAPPSTORE_KEYSTORE_BASE64: ${{ secrets.DAPPSTORE_KEYSTORE_BASE64 }}
          DAPPSTORE_STORE_PASSWORD: ${{ secrets.DAPPSTORE_STORE_PASSWORD }}
          DAPPSTORE_KEY_ALIAS: ${{ secrets.DAPPSTORE_KEY_ALIAS }}
          DAPPSTORE_KEY_PASSWORD: ${{ secrets.DAPPSTORE_KEY_PASSWORD }}
          REOWN_PROJECT_ID: ${{ secrets.REOWN_PROJECT_ID }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            PLAYSTORE_KEYSTORE_BASE64 PLAYSTORE_STORE_PASSWORD PLAYSTORE_KEY_ALIAS PLAYSTORE_KEY_PASSWORD \
            DAPPSTORE_KEYSTORE_BASE64 DAPPSTORE_STORE_PASSWORD DAPPSTORE_KEY_ALIAS DAPPSTORE_KEY_PASSWORD \
            REOWN_PROJECT_ID
          do
            if [[ -z "${!name}" ]]; then
              missing+=("${name}")
            fi
          done
          if [[ "${#missing[@]}" -gt 0 ]]; then
            echo "::error::Missing Actions secrets: ${missing[*]}"
            exit 1
          fi

      # Play and the Solana dApp Store must use different keys, so each flavor
      # gets its own keystore and we refuse to build if they resolve to the
      # same certificate.
      - name: Configure release signing
        id: signing
        env:
          PLAYSTORE_KEYSTORE_BASE64: ${{ secrets.PLAYSTORE_KEYSTORE_BASE64 }}
          PLAYSTORE_STORE_PASSWORD: ${{ secrets.PLAYSTORE_STORE_PASSWORD }}
          PLAYSTORE_KEY_ALIAS: ${{ secrets.PLAYSTORE_KEY_ALIAS }}
          PLAYSTORE_KEY_PASSWORD: ${{ secrets.PLAYSTORE_KEY_PASSWORD }}
          DAPPSTORE_KEYSTORE_BASE64: ${{ secrets.DAPPSTORE_KEYSTORE_BASE64 }}
          DAPPSTORE_STORE_PASSWORD: ${{ secrets.DAPPSTORE_STORE_PASSWORD }}
          DAPPSTORE_KEY_ALIAS: ${{ secrets.DAPPSTORE_KEY_ALIAS }}
          DAPPSTORE_KEY_PASSWORD: ${{ secrets.DAPPSTORE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p android/release-keys
          printf '%s' "${PLAYSTORE_KEYSTORE_BASE64}" | tr -d '[:space:]' | base64 --decode > android/release-keys/playstore.jks
          printf '%s' "${DAPPSTORE_KEYSTORE_BASE64}" | tr -d '[:space:]' | base64 --decode > android/release-keys/dappstore.jks
          test -s android/release-keys/playstore.jks
          test -s android/release-keys/dappstore.jks

          fingerprint() {
            keytool -exportcert -keystore "$1" -alias "$2" -storepass:env "$3" | sha256sum | awk '{ print $1 }'
          }
          playstore=$(fingerprint android/release-keys/playstore.jks "${PLAYSTORE_KEY_ALIAS}" PLAYSTORE_STORE_PASSWORD)
          dappstore=$(fingerprint android/release-keys/dappstore.jks "${DAPPSTORE_KEY_ALIAS}" DAPPSTORE_STORE_PASSWORD)
          echo "playstore keystore certificate SHA-256: ${playstore}"
          echo "dappstore keystore certificate SHA-256: ${dappstore}"
          if [[ "${playstore}" == "${dappstore}" ]]; then
            echo "::error::The playstore and dappstore secrets select the same certificate. Check the keystore and alias secrets."
            exit 1
          fi
          echo "playstore=${playstore}" >> "${GITHUB_OUTPUT}"
          echo "dappstore=${dappstore}" >> "${GITHUB_OUTPUT}"

          # key.properties is a Java properties file: backslashes need escaping.
          esc() { printf '%s' "${1//\\/\\\\}"; }
          {
            echo "playstore.storeFile=../release-keys/playstore.jks"
            echo "playstore.storePassword=$(esc "${PLAYSTORE_STORE_PASSWORD}")"
            echo "playstore.keyAlias=$(esc "${PLAYSTORE_KEY_ALIAS}")"
            echo "playstore.keyPassword=$(esc "${PLAYSTORE_KEY_PASSWORD}")"
            echo "dappstore.storeFile=../release-keys/dappstore.jks"
            echo "dappstore.storePassword=$(esc "${DAPPSTORE_STORE_PASSWORD}")"
            echo "dappstore.keyAlias=$(esc "${DAPPSTORE_KEY_ALIAS}")"
            echo "dappstore.keyPassword=$(esc "${DAPPSTORE_KEY_PASSWORD}")"
          } > android/key.properties

      - name: Setup Android NDK
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/28.2.13676358" >> "${GITHUB_ENV}"

      - name: Pre-install pinned gobind
        run: |
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260611195102-4dd8f1dbf5d2
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"

      - name: Build libbox
        run: ./scripts/build-libbox.sh

      - run: flutter pub get

      # GOOGLE_LOGIN_ENABLED is a repo variable; set it to "true" once the
      # playstore key's SHA-1 is registered for com.erebrus.vpn in Google Cloud.
      - name: Build playstore APK and App Bundle
        env:
          REOWN_PROJECT_ID: ${{ secrets.REOWN_PROJECT_ID }}
          GOOGLE_LOGIN_ENABLED: ${{ vars.GOOGLE_LOGIN_ENABLED }}
        run: |
          {
            echo "REOWN_PROJECT_ID=${REOWN_PROJECT_ID}"
            echo "EREBRUS_WEB_ORIGIN=${EREBRUS_WEB_ORIGIN}"
            echo "GATEWAY_URL=${GATEWAY_URL}"
            echo "GOOGLE_LOGIN_ENABLED=${GOOGLE_LOGIN_ENABLED}"
          } > .env
          flutter build apk --flavor playstore --release
          flutter build appbundle --flavor playstore --release

      # The dApp Store build has no Google login: its signing key is not
      # registered in Google Cloud, so the button would only fail.
      - name: Build dappstore APK
        env:
          REOWN_PROJECT_ID: ${{ secrets.REOWN_PROJECT_ID }}
        run: |
          {
            echo "REOWN_PROJECT_ID=${REOWN_PROJECT_ID}"
            echo "EREBRUS_WEB_ORIGIN=${EREBRUS_WEB_ORIGIN}"
            echo "GATEWAY_URL=${GATEWAY_URL}"
            echo "GOOGLE_LOGIN_ENABLED=false"
          } > .env
          flutter build apk --flavor dappstore --release

      - name: Package and verify signatures
        env:
          EXPECTED_PLAYSTORE_SHA256: ${{ steps.signing.outputs.playstore }}
          EXPECTED_DAPPSTORE_SHA256: ${{ steps.signing.outputs.dappstore }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-playstore-release.apk "dist/erebrus-vpn-playstore-${TAG}.apk"
          cp build/app/outputs/flutter-apk/app-dappstore-release.apk "dist/erebrus-vpn-dappstore-${TAG}.apk"
          cp build/app/outputs/bundle/playstoreRelease/app-playstore-release.aab "dist/erebrus-vpn-playstore-${TAG}.aab"

          bt=$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          apk_cert() {
            "${bt}/apksigner" verify --print-certs "$1" | awk '/certificate SHA-256 digest/ { print $NF; exit }'
          }
          playstore=$(apk_cert "dist/erebrus-vpn-playstore-${TAG}.apk")
          dappstore=$(apk_cert "dist/erebrus-vpn-dappstore-${TAG}.apk")
          echo "playstore APK certificate SHA-256: ${playstore}"
          echo "dappstore APK certificate SHA-256: ${dappstore}"
          if [[ "${playstore}" != "${EXPECTED_PLAYSTORE_SHA256}" || "${dappstore}" != "${EXPECTED_DAPPSTORE_SHA256}" ]]; then
            echo "::error::An APK is not signed with its flavor's keystore. Check the Gradle signing configuration."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ env.TAG }}
          if-no-files-found: error
          path: dist/*

  build-macos:
    needs: [prepare, verify]
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      GOTOOLCHAIN: local
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      # The macOS app embeds the ErebrusTunnel Network Extension, which Xcode
      # only builds with NetSepio's Apple Developer team (76KW3AMAW5) signing
      # and provisioning profiles. Until those are available to CI, skip the
      # build (job stays green) instead of failing on "No profiles found".
      # Set the repo variable ENABLE_MACOS_BUILD=true once signing is set up.
      - name: Check macOS signing availability
        id: gate
        env:
          ENABLED: ${{ vars.ENABLE_MACOS_BUILD }}
        run: |
          if [[ "${ENABLED}" == "true" ]]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::macOS build skipped — needs Apple Developer signing for team 76KW3AMAW5. Set repo variable ENABLE_MACOS_BUILD=true once it is configured."
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.enabled == 'true'

      - uses: actions/setup-go@v5
        if: steps.gate.outputs.enabled == 'true'
        with:
          go-version: "1.27"

      - uses: subosito/flutter-action@v2
        if: steps.gate.outputs.enabled == 'true'
        with:
          channel: stable
          cache: true

      - name: Configure build env
        if: steps.gate.outputs.enabled == 'true'
        env:
          REOWN_PROJECT_ID: ${{ secrets.REOWN_PROJECT_ID }}
        run: |
          {
            echo "REOWN_PROJECT_ID=${REOWN_PROJECT_ID}"
            echo "EREBRUS_WEB_ORIGIN=${EREBRUS_WEB_ORIGIN}"
            echo "GATEWAY_URL=${GATEWAY_URL}"
          } > .env

      - name: Pre-install pinned gobind
        if: steps.gate.outputs.enabled == 'true'
        run: |
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260611195102-4dd8f1dbf5d2
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"

      # One interpreter for install and run: the runner's bare `pip` targets a
      # different Python than `python3`, so Pillow went missing.
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.enabled == 'true'
        with:
          python-version: "3.12"
      - if: steps.gate.outputs.enabled == 'true'
        run: python -m pip install pillow
      - if: steps.gate.outputs.enabled == 'true'
        run: chmod +x scripts/build-desktop.sh scripts/fetch-singbox-cli.sh
      - if: steps.gate.outputs.enabled == 'true'
        run: ./scripts/build-desktop.sh macos

      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          name: macos-${{ env.TAG }}
          if-no-files-found: error
          path: dist/*

  build-linux:
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libwebkit2gtk-4.1-dev libsecret-1-dev libjsoncpp-dev libayatana-appindicator3-dev

      - name: Configure build env
        env:
          REOWN_PROJECT_ID: ${{ secrets.REOWN_PROJECT_ID }}
        run: |
          {
            echo "REOWN_PROJECT_ID=${REOWN_PROJECT_ID}"
            echo "EREBRUS_WEB_ORIGIN=${EREBRUS_WEB_ORIGIN}"
            echo "GATEWAY_URL=${GATEWAY_URL}"
          } > .env

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pillow
      - run: chmod +x scripts/build-desktop.sh scripts/fetch-singbox-cli.sh
      - run: ./scripts/build-desktop.sh linux

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ env.TAG }}
          if-no-files-found: error
          path: dist/*

  build-windows:
    needs: [prepare, verify]
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    # The runner default is PowerShell, which hands `./scripts/*.sh` to the
    # file association instead of running it — the build silently did nothing.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configure build env
        env:
          REOWN_PROJECT_ID: ${{ secrets.REOWN_PROJECT_ID }}
        run: |
          {
            echo "REOWN_PROJECT_ID=${REOWN_PROJECT_ID}"
            echo "EREBRUS_WEB_ORIGIN=${EREBRUS_WEB_ORIGIN}"
            echo "GATEWAY_URL=${GATEWAY_URL}"
          } > .env

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pillow
      - run: chmod +x scripts/build-desktop.sh scripts/fetch-singbox-cli.sh
      - run: ./scripts/build-desktop.sh windows

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ env.TAG }}
          if-no-files-found: error
          path: dist/*

  github-release:
    if: github.ref_type == 'tag'
    needs: [prepare, build-android, build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version_name }}+${{ needs.prepare.outputs.version_code }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-${{ env.TAG }}"
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: Write release notes
        run: |
          cat > notes.md <<EOF
          Version: \`${VERSION}\`

          | Artifact | Platform |
          |----------|----------|
          | \`erebrus-vpn-playstore-${TAG}.apk\` | Android sideload (Play Store key) |
          | \`erebrus-vpn-playstore-${TAG}.aab\` | Android App Bundle for the Play Console |
          | \`erebrus-vpn-dappstore-${TAG}.apk\` | Solana Mobile / dApp Store (dApp Store key) |
          | \`erebrus-vpn-linux-${TAG}.tar.gz\` | Linux bundle |
          | \`erebrus-vpn-windows-${TAG}.zip\` | Windows |

          Both APKs use \`com.erebrus.vpn\` with different certificates — install one.

          ## Changes

          EOF
          cat changelog-section.md >> notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Erebrus VPN ${{ needs.prepare.outputs.version_name }}
          body_path: notes.md
          make_latest: true
          fail_on_unmatched_files: true
          files: dist/*
